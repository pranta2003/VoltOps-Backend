name: CI

# Triggers on push and pull request targeting pranta and main.
# Ensures that all code compiles cleanly, the Prisma schema validates,
# and TypeScript type checks pass before any branch is integrated.
on:
  push:
    branches: [main, pranta]
  pull_request:
    branches: [main, pranta]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    # Safe placeholder database URL: "prisma validate" and "prisma generate"
    # require DATABASE_URL to be defined syntactically, but do not connect
    # to a live database. Real database migrations run during deployments.
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/voltops_ci"
      JWT_SECRET: "ci-test-jwt-secret-placeholder-minimum-32-chars-long"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Type-check and Build
        run: npm run build
